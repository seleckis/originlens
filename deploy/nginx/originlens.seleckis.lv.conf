server {
    listen 80;
    server_name originlens.seleckis.lv;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name originlens.seleckis.lv;

    include snippets/ssl-seleckis.lv.conf;

    root /var/www/originlens/releases;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /originlens-stage-2.zip {
        default_type application/zip;
        add_header Content-Disposition "attachment; filename=originlens-stage-2.zip" always;
        try_files $uri =404;
    }

    location = /originlens-stage-2.zip.sha256 {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
