server {
    listen 80;
    server_name fixtures.example.invalid;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fixtures.example.invalid;

    include snippets/ssl-example.invalid.conf;

    root /var/www/originlens/releases;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /originlens-release-candidate.zip {
        default_type application/zip;
        add_header Content-Disposition "attachment; filename=originlens-release-candidate.zip" always;
        try_files $uri =404;
    }

    location = /originlens-release-candidate.zip.sha256 {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /fixtures {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        return 308 /fixtures/;
    }

    location = /fixtures/redirect {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        return 302 /fixtures/benign-search.html;
    }

    location = /fixtures/payment-redirect {
        if ($request_method !~ "^(GET|HEAD)$") { return 405; }
        return 302 /fixtures/payment-redirect.html;
    }

    location ^~ /fixtures/ {
        alias /var/www/originlens/fixtures/;
        index index.html;
        default_type text/html;
        limit_except GET HEAD { deny all; }
    }

    location / {
        return 404;
    }
}
