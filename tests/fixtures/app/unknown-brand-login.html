<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example Credit Union login — synthetic fixture</title>
  </head>
  <body>
    <main>
      <h1>Example Credit Union</h1>
      <p>
        This deliberately unknown organization requests credentials. OriginLens
        must not warn without a strong registry-backed identity claim and
        verified-domain mismatch.
      </p>
      <form>
        <label>User ID <input autocomplete="username" /></label>
        <label
          >Password <input type="password" autocomplete="current-password"
        /></label>
        <button type="button">Sign in</button>
      </form>
    </main>
  </body>
</html>
